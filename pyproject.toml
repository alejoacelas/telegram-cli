[project]
name = "tg"
version = "0.1.0"
description = "Telegram command-line client: read-only by default"
readme = "README.md"
authors = [
    { name = "Alejandro Acelas", email = "alejoacelas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "qrcode[pil]>=8.2",
    "telethon>=1.45.0",
]

[project.scripts]
tg = "tg.cli:main"
tg-login = "tg.login:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"
